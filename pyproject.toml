[project]
name = "adapterlab"
version = "0.1.0"
description = "Dataset validation, reproducible LoRA training, and adapter evaluation."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2,<2.1", "httpx>=0.28,<1"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "transformers>=4.50,<6", "peft>=0.17,<1", "safetensors>=0.5,<1", "numpy>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
adapterlab-worker = "adapterlab.worker:main"
adapterlab-train = "adapterlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/adapterlab"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "ml" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
