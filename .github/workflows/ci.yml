name: Verify AdapterLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --extra ml --extra dev
      - run: uv run ruff check backend tests scripts
      - run: uv run ruff format --check backend tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/verify_fixtures.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --extra ml --extra dev
        working-directory: .
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: uv run python scripts/verify_training.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
